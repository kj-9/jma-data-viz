<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>WebGL points layer</title>
  <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@3.0.7/dist/pmtiles.min.js"></script>
  <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font: 13px/1.45 "M PLUS 1", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: #dbe8f4;
      background: radial-gradient(circle at 20% 15%, #1b2d46 0%, #0a1420 55%, #060b12 100%);
    }

    :root {
      --panel-bg: rgba(10, 20, 34, 0.52);
      --panel-border: rgba(146, 178, 208, 0.22);
      --panel-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      --text-main: #e8f1fb;
      --text-sub: #a9bfd6;
      --accent: #51a7ff;
      --accent-strong: #2b88f3;
      --danger: #ff8b5b;
    }

    .map {
      width: 100vw;
      height: 100vh;
    }

    .map-overlay {
      font: inherit;
      position: absolute;
      width: min(296px, calc(100vw - 24px));
      top: 12px;
      left: 12px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 3;
    }

    .panel-stack {
      background: linear-gradient(160deg, rgba(17, 35, 57, 0.82) 0%, var(--panel-bg) 100%);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow);
      border-radius: 14px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .legend-stack {
      background: linear-gradient(160deg, rgba(18, 37, 58, 0.86) 0%, rgba(10, 21, 35, 0.76) 100%);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 12px 12px 10px;
      font: inherit;
      box-shadow: var(--panel-shadow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .legend-stack.bottom-right {
      position: absolute;
      right: 12px;
      top: 12px;
      width: min(300px, calc(100vw - 24px));
      z-index: 3;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-section + .panel-section {
      border-top: 1px solid rgba(158, 184, 208, 0.2);
      padding-top: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text-main);
    }

    .section-controls {
      display: inline-flex;
      gap: 6px;
    }

    .ghost-button {
      border: 1px solid rgba(161, 194, 224, 0.36);
      background: rgba(28, 49, 74, 0.62);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      color: #e4effa;
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
    }

    .ghost-button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(190, 220, 246, 0.72);
      background: rgba(38, 65, 98, 0.75);
    }

    .ghost-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .primary-chip {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: #fff;
      border-color: rgba(97, 173, 248, 0.9);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip-button {
      border: 1px solid rgba(147, 176, 204, 0.34);
      background-color: rgba(33, 58, 85, 0.52);
      color: #d6e8fb;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .chip-button.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: #fff;
      border-color: rgba(97, 173, 248, 0.9);
    }

    .map-overlay-inner select,
    .radius-input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid rgba(151, 182, 208, 0.42);
      font-size: 11px;
      box-sizing: border-box;
      color: var(--text-main);
      background: rgba(18, 34, 54, 0.8);
    }

    .radio-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .radio-option {
      border: 1px solid rgba(147, 178, 205, 0.34);
      border-radius: 8px;
      padding: 5px;
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
      cursor: pointer;
      background: rgba(22, 42, 66, 0.62);
      color: var(--text-main);
    }

    .radio-option input[type="radio"] {
      margin: 0;
      accent-color: var(--accent);
    }

    .result-panel {
      font-size: 11px;
      line-height: 1.5;
      border: 1px solid rgba(145, 176, 203, 0.32);
      border-radius: 8px;
      padding: 8px;
      background: rgba(15, 31, 49, 0.68);
      color: var(--text-main);
    }

    .result-panel strong {
      display: inline-block;
      min-width: 68px;
      color: var(--text-sub);
    }

    .legend-card {
      border-radius: 8px;
      border: 1px solid rgba(155, 186, 211, 0.24);
      padding: 8px;
      background: rgba(17, 35, 55, 0.7);
    }

    .radius-slider {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radius-input {
      appearance: none;
      height: 6px;
      border: none;
      background: linear-gradient(90deg, rgba(81, 167, 255, 0.7) 0%, rgba(255, 139, 91, 0.8) 100%);
      border-radius: 999px;
      padding: 0;
    }

    .radius-input::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 0 3px rgba(81, 167, 255, 0.42);
    }

    .radius-input::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border: 3px solid rgba(81, 167, 255, 0.42);
    }

    .radius-value {
      font-size: 10px;
      color: var(--text-sub);
      text-align: right;
      font-family: "Space Mono", monospace;
      letter-spacing: 0.03em;
    }

    .legend-stack #legend-gradient {
      color: var(--text-main);
      font-size: 11px;
      font-family: "Space Mono", monospace;
    }

    @media (max-width: 900px) {
      .map-overlay {
        width: calc(100vw - 16px);
        left: 8px;
        top: 8px;
      }

      .legend-stack.bottom-right {
        top: auto;
        bottom: 8px;
        right: 8px;
        width: calc(100vw - 16px);
      }

      .panel-stack {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="map" class="map"></div>
  <div class="map-overlay top">
    <div class="panel-stack">
      <div class="section-header">
        <span class="section-title">表示設定</span>
      </div>
      <div class="panel-section">
        <div class="section-header">
          <span class="section-title">データ日付</span>
          <div class="section-controls">
            <button class="ghost-button" id="prev-date-btn">前へ</button>
            <button class="ghost-button" id="next-date-btn">次へ</button>
          </div>
        </div>
        <select id="date-selector" name="date"></select>
      </div>

      <div class="panel-section">
        <span class="section-title">表示する気温</span>
        <div class="radio-options">
          <label class="radio-option" for="max">
            <input type="radio" id="max" name="temp" value="max" checked />
            <span>予想最高気温</span>
          </label>
          <label class="radio-option" for="min">
            <input type="radio" id="min" name="temp" value="min" />
            <span>予想最低気温</span>
          </label>
        </div>
      </div>
    </div>

    <div class="panel-stack">
      <div class="section-header">
        <span class="section-title">検索設定</span>
        <div class="section-controls">
          <button class="ghost-button primary-chip" id="locate-btn">現在地</button>
        </div>
      </div>
      <div class="panel-section">
        <label class="section-title" for="radius-input">検索半径 (km)</label>
        <div class="radius-slider">
          <input type="range" id="radius-input" class="radius-input" name="radius" min="10" max="500" step="10" value="50" />
          <div class="radius-value"><span id="radius-value">50</span> km</div>
        </div>
      </div>
      <div class="panel-section">
        <div id="search-result" class="result-panel">
          地図をクリックすると指定半径内で最も低い気温の地点を検索します。
        </div>
      </div>
    </div>
  </div>
  <div class="legend-stack bottom-right">
    <div class="section-header" style="margin-bottom: 6px;">
      <span class="section-title">気温(°C)</span>
    </div>
    <div id="legend-gradient"></div>
  </div>
    <script type="module" src="main.js"></script>
</body>

</html>
